# /etc/nginx/sites-available/julietaponz.com  →  ln -s a sites-enabled
# Luego: sudo certbot --nginx -d julietaponz.com -d www.julietaponz.com   (agrega SSL y la redirección a HTTPS)

# ── Límites de peticiones por IP (primera barrera; la app tiene los suyos y los bloqueos en la BD) ──
limit_req_zone $binary_remote_addr zone=cobros_auth:10m rate=10r/m;    # login / recuperar contraseña
limit_req_zone $binary_remote_addr zone=cobros_portal:10m rate=60r/m;  # portal (enlace + CI/PIN, subidas)
limit_req_zone $binary_remote_addr zone=cobros_general:20m rate=20r/s; # resto del sitio
limit_conn_zone $binary_remote_addr zone=cobros_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Micro-caché de la landing (ver location de /es y /pt)
proxy_cache_path /var/cache/nginx/cobros_landing levels=1:2 keys_zone=cobros_landing:10m max_size=100m inactive=10m use_temp_path=off;
server_tokens off;

# Hosts desconocidos (escaneos por IP, Host falsos): se cierra la conexión sin responder.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

upstream cobros_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

# www → dominio principal
server {
    listen 80;
    listen [::]:80;
    server_name www.julietaponz.com;
    return 301 https://julietaponz.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name julietaponz.com;

    # Archivos de hasta 50 MB: el límite exacto lo valida la app; aquí se deja un margen
    # para la cabecera multipart (un archivo de 50 MB justos ocupa algo más de 50M en la petición).
    client_max_body_size 55M;
    client_body_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json;

    # CSP (con nonce), X-Frame-Options, Permissions-Policy, etc. los pone la app. Aquí lo que depende de TLS:
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_conn cobros_conn 40;

    # Estáticos con caché larga (nombres con hash)
    location /_next/static/ {
        proxy_pass http://cobros_next;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Login y recuperación de contraseña: 10 por minuto por IP (ráfaga de 5).
    location /api/auth/ {
        limit_req zone=cobros_auth burst=5 nodelay;
        proxy_pass http://cobros_next;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Portal del estudiante/cliente (acceso con CI/PIN y subidas de comprobantes/archivos).
    location /p/ {
        limit_req zone=cobros_portal burst=30 nodelay;
        proxy_pass http://cobros_next;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Landing (/es, /pt): micro-caché de 10 s. La app la genera con un nonce MARCADOR y Nginx lo reemplaza en
    # cada respuesta por uno aleatorio ($request_id) junto con la CSP: la CSP estricta sigue intacta y la
    # landing aguanta miles de visitas por segundo. Un cambio de textos/colores tarda hasta 10 s en verse.
    # Requiere LANDING_CACHE_NGINX=1 en la app (ecosystem.config.js lo pone). Mantener la CSP igual a politicaCsp() de src/proxy.ts.
    location ~ ^/(es|pt)/?$ {
        limit_req zone=cobros_general burst=60 nodelay;
        proxy_pass http://cobros_next;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Landing-Cache 1;
        proxy_set_header Accept-Encoding "";          # sub_filter necesita el HTML sin comprimir (Nginx lo comprime después)

        proxy_cache cobros_landing;
        proxy_cache_key "$scheme$host$uri";           # sin query string: nada que el visitante controle entra a la caché
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;                          # una sola petición regenera; las demás esperan o usan la anterior
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache_bypass $http_rsc $http_next_router_prefetch $cookie_cobros_session_token;
        proxy_no_cache $http_rsc $http_next_router_prefetch $cookie_cobros_session_token;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;

        sub_filter_once off;
        sub_filter "CSPNONCEMARCADOR0000000000000000" $request_id;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Cache $upstream_cache_status always;
    }

    # Los jobs solo se llaman desde el propio servidor (crontab → 127.0.0.1:3000), nunca desde fuera.
    location /api/jobs/ {
        return 404;
    }

    location / {
        limit_req zone=cobros_general burst=60 nodelay;
        proxy_pass http://cobros_next;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
