# /etc/nginx/sites-available/julietaponz.com  →  ln -s a sites-enabled
# Luego: sudo certbot --nginx -d julietaponz.com -d www.julietaponz.com   (agrega SSL y la redirección a HTTPS)

upstream cobros_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

# www → dominio principal
server {
    listen 80;
    listen [::]:80;
    server_name www.julietaponz.com;
    return 301 https://julietaponz.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name julietaponz.com;

    # Archivos de hasta 50 MB: el límite exacto lo valida la app; aquí se deja un margen
    # para la cabecera multipart (un archivo de 50 MB justos ocupa algo más de 50M en la petición).
    client_max_body_size 55M;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Estáticos con caché larga (nombres con hash)
    location /_next/static/ {
        proxy_pass http://cobros_next;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://cobros_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
